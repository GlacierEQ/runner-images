name: APEX Public Runner Bridge Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apex-private-read-bridge-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm public runner capacity
        run: echo "PUBLIC_RUNNER_READY"
      - name: Require private read bridge
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.APEX_PRIVATE_READ_TOKEN || secrets.GH_PAT }}
        run: test -n "$PRIVATE_READ_TOKEN"
      - name: Checkout receipt branch
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true
      - name: Publish bridge readiness receipt
        run: |
          set -euo pipefail
          mkdir -p receipts
          {
            echo "runner_repo=${GITHUB_REPOSITORY}"
            echo "runner_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "private_read_bridge=ready"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > receipts/APEX_PRIVATE_READ_BRIDGE_READY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/APEX_PRIVATE_READ_BRIDGE_READY.txt
          if git diff --cached --quiet; then
            echo "Receipt already current"
          else
            git commit -m "receipt(runner): private-read bridge ready"
            git push origin HEAD:main
          fi
